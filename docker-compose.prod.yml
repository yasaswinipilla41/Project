name: prio

# Production stack: same services as docker-compose.yml, minus the mailpit
# SMTP sink. Point SMTP_* at a real relay via .env — there is no dev fallback
# here, so SMTP_HOST/SMTP_PORT are required.
#
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:17-alpine
    container_name: prio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prio_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-prio}
    ports:
      - "5433:5432"
    volumes:
      - prio-postgres-data:/var/lib/postgresql/data
      - ./scripts/backup:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prio} -d ${POSTGRES_DB:-prio}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: prio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - prio-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies pending migrations, then exits. `app` will not start until
  # this has completed successfully, so no request is ever served against a
  # schema that has not been migrated (§43).
  # Seeding uses the same image:
  #   docker compose -f docker-compose.prod.yml run --rm migrate npx tsx prisma/seed.ts
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: prio-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-prio}:${POSTGRES_PASSWORD:-prio_dev_password}@postgres:5432/${POSTGRES_DB:-prio}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@symbiosystech.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Prio@12345}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Prio@12345}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: prio-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-prio}:${POSTGRES_PASSWORD:-prio_dev_password}@postgres:5432/${POSTGRES_DB:-prio}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required — point at a real relay, mailpit is not part of this stack}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Prio <no-reply@prio.local>}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@symbiosystech.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Prio@12345}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Prio@12345}
      # Attachment bytes live on the volume below, never in the database.
      PRIO_STORAGE_DIR: /app/storage
    volumes:
      - prio-storage:/app/storage
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  prio-postgres-data:
  prio-redis-data:
  # Uploaded files. Kept out of the image so a rebuild never discards them.
  prio-storage:
