name: prio

services:
  postgres:
    image: postgres:17-alpine
    container_name: prio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prio_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-prio}
    ports:
      - "5433:5432"
    volumes:
      - prio-postgres-data:/var/lib/postgresql/data
      - ./scripts/backup:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prio} -d ${POSTGRES_DB:-prio}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: prio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - prio-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local SMTP sink so email delivery is verifiable without a real provider.
  # Web UI: http://localhost:8025 — remove this service in production and point
  # SMTP_* at the real relay.
  mailpit:
    image: axllent/mailpit:latest
    container_name: prio-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  # One-shot: applies pending migrations, then exits. `app` will not start until
  # this has completed successfully, so no request is ever served against a
  # schema that has not been migrated (§43).
  # Seeding uses the same image:
  #   docker compose run --rm migrate npx tsx prisma/seed.ts
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: prio-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-prio}:${POSTGRES_PASSWORD:-prio_dev_password}@postgres:5432/${POSTGRES_DB:-prio}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@symbiosystech.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Prio@12345}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Prio@12345}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: prio-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # The organisation's own day.
      #
      # "Overdue", "due today" and "due this week" are calendar questions, and
      # they are answered with the server's local clock. Without this the
      # container runs in UTC, so the working day rolled over five and a half
      # hours after it did for the people using Prio — work due today was
      # already overdue for part of the evening, and a week boundary fell in
      # the middle of one. Set it and the server's day is the business day.
      TZ: ${TZ:-Asia/Kolkata}
      DATABASE_URL: postgresql://${POSTGRES_USER:-prio}:${POSTGRES_PASSWORD:-prio_dev_password}@postgres:5432/${POSTGRES_DB:-prio}?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Prio <no-reply@prio.local>}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@symbiosystech.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Prio@12345}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Prio@12345}
      # Attachment bytes live on the volume below, never in the database.
      PRIO_STORAGE_DIR: /app/storage
    volumes:
      - prio-storage:/app/storage
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  prio-postgres-data:
  prio-redis-data:
  # Uploaded files. Kept out of the image so a rebuild never discards them.
  prio-storage:
